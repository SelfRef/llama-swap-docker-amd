# Example llama-swap configuration for the AMD (ROCm + Vulkan) image.
#
# Every engine is present in two builds:
#   ROCm (HIP):  llama-server-rocm, whisper-server-rocm, sd-server-rocm, ...
#   Vulkan:      llama-server, whisper-server, sd-server, ...
# Pick per model whichever backend suits your GPU. audio.cpp (audiocpp_server)
# is Vulkan-only. Both llama.cpp builds are current master plus the open
# upstream PRs listed in the Dockerfile (LLAMA_PATCHES); `llama-server-engram`
# (Strix Halo fork, :full tag only) and `llama-server-fpx` (ROCmFPx fork, both
# tags -- the only build that can load ROCmFP4/ROCmFPx weight files) are the
# other two llama.cpp installs. Full config reference:
# https://github.com/mostlygeek/llama-swap/wiki/Configuration

healthCheckTimeout: 300
logRequests: true

models:
  # llama.cpp on ROCm -- fastest on GPUs with ROCm support
  "qwen3-4b":
    cmd: >
      llama-server-rocm
      -hf unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      --port ${PORT}
      -ngl 999

  # Same model on Vulkan -- for GPUs ROCm doesn't cover (or when it misbehaves)
  "qwen3-4b-vulkan":
    cmd: >
      llama-server
      -hf unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      --port ${PORT}
      -ngl 999

  # ROCmFPx fork: the ROCmFP4 weight formats stock llama.cpp cannot load, plus
  # adaptive draft sizing. On an RX 7900 XTX, Qwen3.8-27B ROCmFP4-FAST with the
  # model's own MTP head decodes ~26-35% faster than the same model as
  # UD-Q4_K_XL on `llama-server`, in 3.3 GiB less VRAM (see the WITH_FPX arg in
  # the Dockerfile for the numbers and the quality cost).
  "qwen38-fp4":
    cmd: >
      llama-server-fpx
      -hf julianmb/Qwen-3.8-27B-ROCmFP4-FAST-GGUF:FAST
      --port ${PORT}
      -ngl 999
      --flash-attn on
      --spec-type draft-mtp --spec-draft-n-max 4

  "whisper":
    checkEndpoint: /v1/audio/transcriptions/
    cmd: >
      whisper-server-rocm
      --port ${PORT}
      -m /models/whisper.bin
      --flash-attn
      --request-path /v1/audio/transcriptions --inference-path ""

  "image":
    checkEndpoint: /
    cmd: |
      sd-server-rocm
      --listen-port ${PORT}
      --diffusion-fa
      --diffusion-model /models/z_image_turbo-Q8_0.gguf
      --vae /models/ae.safetensors
      --llm /models/qwen3-4b-instruct-2507-q8_0.gguf
      --offload-to-cpu
      --cfg-scale 1.0
      --height 512 --width 512
      --steps 8

  # audio.cpp for TTS -- Vulkan build only (no HIP backend upstream).
  # Needs its own JSON server config (see audio.cpp's server docs); set
  # "backend": "vulkan" in it -- the binary defaults to cuda.
  "audio":
    checkEndpoint: /health
    cmd: |
      audiocpp_server
      --config /models/audiocpp-server.json
      --port ${PORT}
