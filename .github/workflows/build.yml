name: Build image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - Dockerfile
      - config/**
      - patches/**
      - scripts/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - config/**
      - patches/**
      - scripts/**
      - .github/workflows/build.yml
  schedule:
    # Rebuild every 3 days from the current default branches of llama-swap,
    # llama.cpp (+ the ROCmFPx fork), whisper.cpp, stable-diffusion.cpp,
    # audio.cpp and EngramHalo,
    # with the current heads of the merged PRs. Scheduled runs publish both
    # images.
    - cron: "0 4 */3 * *"
  workflow_dispatch:
    inputs:
      rocm:
        description: "Also build the ROCm stages and publish the full image as :full/:latest, as branch pushes do (hours of runner time)"
        type: boolean
        required: false
        default: false
      llama_commit:
        description: "llama.cpp revision (sha/tag/branch/refs/pull/N/head); empty = Dockerfile default (master)"
        required: false
        default: ""
      llama_patches:
        description: "upstream llama.cpp PR numbers to merge (space-separated); empty = Dockerfile default"
        required: false
        default: ""
      llama_swap_commit:
        description: "llama-swap revision (sha/tag such as v255/branch); empty = Dockerfile default (main)"
        required: false
        default: ""
      llama_swap_patches:
        description: "upstream llama-swap PR numbers to merge (space-separated); empty = Dockerfile default"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Two published images from one Dockerfile (WITH_ROCM build arg):
#   :vulkan          Vulkan only  -- every push, the 3-day scheduled rebuild,
#                    and every manual run.
#   :full / :latest  Vulkan+ROCm  -- every push, the 3-day scheduled rebuild,
#                    or a manual run with the "rocm" checkbox; the HIP stages
#                    are fat multi-gfx builds that take hours on a runner.
#                    :latest is the full image.
#
# Nothing is inherited from another image any more, so nothing in the build
# would change between two scheduled runs by itself: the prepare job resolves
# every branch, tag and PR head to a commit ONCE (scripts/resolve-refs.sh) and
# every job builds with those as build args. That is both the cache key (a
# moved branch or updated PR rebuilds exactly the stages that use it) and the
# guarantee that the Vulkan and ROCm builds of an engine, built in different
# jobs hours apart, are the same revision.

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      build_args: ${{ steps.refs.outputs.build_args }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        run: docker build --check .

      # GHCR requires lowercase names; github.repository may contain uppercase
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream refs to commits
        id: refs
        env:
          LLAMA_COMMIT: ${{ github.event.inputs.llama_commit }}
          LLAMA_PATCHES: ${{ github.event.inputs.llama_patches }}
          LLAMA_SWAP_COMMIT: ${{ github.event.inputs.llama_swap_commit }}
          LLAMA_SWAP_PATCHES: ${{ github.event.inputs.llama_swap_patches }}
        run: |
          scripts/resolve-refs.sh | tee /tmp/build-args
          { echo 'build_args<<EOF'; cat /tmp/build-args; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          { echo '### Resolved refs'; echo '```'; cat /tmp/build-args; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # One job per builder stage, in parallel; results land in per-stage registry
  # caches that the assemble jobs reuse. Vulkan stages always run.
  build-stages-vulkan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [llama-vulkan, llama-fpx, whisper-vulkan, sd-vulkan, audiocpp, llama-swap-build]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR intermittently answers blob GETs with 429 (sub-second retry-after)
      # and buildx treats it as fatal, so retry the step once; the registry
      # cache makes the second pass cheap.
      - name: Build ${{ matrix.target }} stage
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', needs.prepare.outputs.image, matrix.target) || '' }}
      - name: Build ${{ matrix.target }} stage (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', needs.prepare.outputs.image, matrix.target) || '' }}

  # The ROCm stages are fat HIP builds (8 gfx targets, all-quant flash
  # attention): on every push and scheduled rebuild, or a manual run with the
  # "rocm" checkbox.
  build-stages-rocm:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.rocm)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [llama-rocm, llama-engram, whisper-rocm, sd-rocm]
    steps:
      - uses: actions/checkout@v7
      # ROCm dev base + build trees are large; stock runners have ~20 GB free
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same 429 retry as in build-stages-vulkan.
      - name: Build ${{ matrix.target }} stage
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }},mode=max
      - name: Build ${{ matrix.target }} stage (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: ${{ needs.prepare.outputs.build_args }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }},mode=max

  # Vulkan-only image -> :vulkan (+ sha / date / version tags). Skipped on PRs:
  # the matrix above already validates the builds.
  build:
    if: github.event_name != 'pull_request'
    needs: [prepare, build-stages-vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=vulkan,enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-vulkan
            type=sha,format=short,prefix=vulkan-
            type=schedule,pattern=vulkan-{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=llama-swap-amd
            org.opencontainers.image.description=llama-swap unified image for AMD GPUs (Vulkan; see :full for Vulkan+ROCm)
      # Same 429 retry as in build-stages-vulkan.
      - name: Build and push (Vulkan only)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_ROCM=false
            ${{ needs.prepare.outputs.build_args }}
          # GHA cache caps at 10 GB -- far too small here, so cache in the registry
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-fpx
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-swap-build
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache,mode=max
      - name: Build and push (Vulkan only, retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_ROCM=false
            ${{ needs.prepare.outputs.build_args }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-fpx
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-swap-build
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache,mode=max

  # Full Vulkan+ROCm image -> :full and :latest (+ full-<sha> / full-<date> /
  # version tags): every push and the 3-day scheduled rebuild, or a manual run
  # with the "rocm" checkbox.
  build-rocm:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.rocm)
    needs: [prepare, build-stages-vulkan, build-stages-rocm]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=full,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=full-
            type=schedule,pattern=full-{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=llama-swap-amd
            org.opencontainers.image.description=llama-swap unified image for AMD GPUs (Vulkan + ROCm)
      # Same 429 retry as in build-stages-vulkan.
      - name: Build and push (Vulkan + ROCm)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_ROCM=true
            ${{ needs.prepare.outputs.build_args }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-fpx
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-swap-build
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-engram
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm,mode=max
      - name: Build and push (Vulkan + ROCm, retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WITH_ROCM=true
            ${{ needs.prepare.outputs.build_args }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-fpx
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-swap-build
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-engram
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm,mode=max
