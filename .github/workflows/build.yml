name: Build image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - Dockerfile
      - config/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - config/**
      - .github/workflows/build.yml
  schedule:
    # Weekly rebuild to pick up the current unified-vulkan base image, current
    # llama.cpp master and the matching whisper.cpp / stable-diffusion.cpp revisions
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      rocm:
        description: "Also build the ROCm stages and publish the full image as :rocm, as branch pushes do (hours of runner time)"
        type: boolean
        required: false
        default: false
      llama_commit:
        description: "llama.cpp revision (sha/tag/branch/refs/pull/N/head); empty = Dockerfile default (master)"
        required: false
        default: ""
      llama_patches:
        description: "upstream llama.cpp PR numbers to merge (space-separated); empty = Dockerfile default"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Two published images from one Dockerfile (WITH_ROCM build arg):
#   :latest  Vulkan only  -- every push / weekly schedule / manual run
#   :rocm    Vulkan+ROCm  -- every branch push, or a manual run with the "rocm"
#            checkbox; the HIP stages are fat multi-gfx builds that take hours
#            on a runner.

jobs:
  # Lint, and pin the base image + image name once so every job in this run
  # builds against the same unified-vulkan digest (it is rebuilt daily; a
  # mid-run update would otherwise cause cache misses between jobs).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      base: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        run: docker build --check .

      # GHCR requires lowercase names; github.repository may contain uppercase
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Pin base image digest
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/mostlygeek/llama-swap:unified-vulkan \
            --format '{{.Manifest.Digest}}')
          echo "Pinned unified-vulkan @ ${DIGEST}"
          echo "ref=ghcr.io/mostlygeek/llama-swap@${DIGEST}" >> "$GITHUB_OUTPUT"

  # One job per builder stage, in parallel; results land in per-stage registry
  # caches that the assemble jobs reuse. Vulkan stages always run.
  build-stages-vulkan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [llama-vulkan, llama-qwen4exp, whisper-vulkan, sd-vulkan, audiocpp-tools]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR intermittently answers blob GETs with 429 (sub-second retry-after)
      # and buildx treats it as fatal, so retry the step once; the registry
      # cache makes the second pass cheap.
      - name: Build ${{ matrix.target }} stage
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', needs.prepare.outputs.image, matrix.target) || '' }}
      - name: Build ${{ matrix.target }} stage (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', needs.prepare.outputs.image, matrix.target) || '' }}

  # The ROCm stages are fat HIP builds (8 gfx targets, all-quant flash
  # attention): on every branch push, or a manual run with the "rocm" checkbox.
  build-stages-rocm:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.rocm)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [llama-rocm, llama-engram, whisper-rocm, sd-rocm]
    steps:
      - uses: actions/checkout@v7
      # ROCm dev base + build trees are large; stock runners have ~20 GB free
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same 429 retry as in build-stages-vulkan.
      - name: Build ${{ matrix.target }} stage
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }},mode=max
      - name: Build ${{ matrix.target }} stage (retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }},mode=max

  # Vulkan-only image -> :latest (+ sha / schedule-date tags). Skipped on PRs:
  # the matrix above already validates the builds.
  build:
    if: github.event_name != 'pull_request'
    needs: [prepare, build-stages-vulkan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=llama-swap-amd
            org.opencontainers.image.description=llama-swap unified image for AMD GPUs (Vulkan; see :rocm for Vulkan+ROCm)
      # Same 429 retry as in build-stages-vulkan.
      - name: Build and push (Vulkan only)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            WITH_ROCM=false
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          # GHA cache caps at 10 GB -- far too small here, so cache in the registry
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-qwen4exp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp-tools
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache,mode=max
      - name: Build and push (Vulkan only, retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            WITH_ROCM=false
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-qwen4exp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp-tools
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache,mode=max

  # Full Vulkan+ROCm image -> :rocm (+ rocm-<sha>): every branch push, or a
  # manual run with the "rocm" checkbox.
  build-rocm:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.rocm)
    needs: [prepare, build-stages-vulkan, build-stages-rocm]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=rocm
            type=sha,format=short,prefix=rocm-
          labels: |
            org.opencontainers.image.title=llama-swap-amd
            org.opencontainers.image.description=llama-swap unified image for AMD GPUs (Vulkan + ROCm)
      # Same 429 retry as in build-stages-vulkan.
      - name: Build and push (Vulkan + ROCm)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            WITH_ROCM=true
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-qwen4exp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp-tools
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-engram
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm,mode=max
      - name: Build and push (Vulkan + ROCm, retry)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            WITH_ROCM=true
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-qwen4exp
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-audiocpp-tools
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-engram
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-rocm,mode=max
