name: Build image

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - Dockerfile
      - config/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - config/**
      - .github/workflows/build.yml
  schedule:
    # Weekly rebuild to pick up the current unified-vulkan base image and the
    # matching llama.cpp / whisper.cpp / stable-diffusion.cpp revisions
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      llama_commit:
        description: "llama.cpp revision (sha/tag/branch/refs/pull/N/head); empty = Dockerfile default (master)"
        required: false
        default: ""
      llama_patches:
        description: "upstream llama.cpp PR numbers to apply (space-separated); empty = Dockerfile default"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, and pin the base image + image name once so every job in this run
  # builds against the same unified-vulkan digest (it is rebuilt daily; a
  # mid-run update would otherwise cause cache misses between jobs).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      base: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: docker build --check .

      # GHCR requires lowercase names; github.repository may contain uppercase
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Pin base image digest
        id: base
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ghcr.io/mostlygeek/llama-swap:unified-vulkan \
            --format '{{.Manifest.Digest}}')
          echo "Pinned unified-vulkan @ ${DIGEST}"
          echo "ref=ghcr.io/mostlygeek/llama-swap@${DIGEST}" >> "$GITHUB_OUTPUT"

  # Each builder stage runs as its own job: the ROCm ones are fat HIP builds
  # (11 gfx targets), the Vulkan ones compile hundreds of shader variants.
  # One job per stage keeps every job well under the 6h runner limit and
  # builds them in parallel. Results land in per-stage registry caches that
  # the assemble job reuses.
  build-stages:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [llama-rocm, whisper-rocm, sd-rocm, llama-vulkan, whisper-vulkan, sd-vulkan]
    steps:
      - uses: actions/checkout@v4

      # ROCm dev base + build trees are large; stock runners have ~20 GB free
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.target }} stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}:buildcache-{1},mode=max', needs.prepare.outputs.image, matrix.target) || '' }}

  # Assemble the final image from the cached stages and push it. Skipped on
  # PRs: without pushed stage caches it would recompile everything serially
  # and overrun the job limit; the matrix above already validates the builds.
  build:
    if: github.event_name != 'pull_request'
    needs: [prepare, build-stages]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=schedule,pattern={{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=llama-swap-amd
            org.opencontainers.image.description=llama-swap unified image for AMD GPUs (ROCm + Vulkan)

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base }}
            ${{ github.event.inputs.llama_commit != '' && format('LLAMA_COMMIT={0}', github.event.inputs.llama_commit) || '' }}
            ${{ github.event.inputs.llama_patches != '' && format('LLAMA_PATCHES={0}', github.event.inputs.llama_patches) || '' }}
          # GHA cache caps at 10 GB — far too small here, so cache in the registry
          cache-from: |
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-rocm
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-llama-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-whisper-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-sd-vulkan
            type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache,mode=max
